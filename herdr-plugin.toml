id = "claude-reload"
name = "Claude Code plugin reload"
version = "0.1.1"
min_herdr_version = "0.9.5"
description = "Types /reload-plugins, or /mcp reconnect all, into a named Claude Code pane once herdr says it is idle and unfocused and its input line is empty, panes ten seconds apart"
platforms = ["linux"]

# A caller queues a request file, then invokes this action; see the README. Every run is one bounded pass over the
# queue, and exits: nothing is left running.
[[actions]]
id = "reload"
title = "Claude reload: try the queued requests now"
description = "Types the queued command into each queued pane that is idle, unfocused and empty now, ten seconds apart"
contexts = ["global"]
command = ["sh", "bin/run.sh"]

# The moments a queued pane may become ready: its agent fell idle, or the focus moved. herdr has no event for the
# input line's text, so that is read from the screen at each try.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/run.sh"]

[[events]]
on = "pane.focused"
command = ["sh", "bin/run.sh"]
